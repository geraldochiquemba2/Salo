services:
  - type: web
    name: talentos
    runtime: node
    plan: free
    buildCommand: bash build.sh
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
    healthCheckPath: /api/healthz
    autoDeploy: true
