services:
  - type: web
    name: salo
    runtime: node
    plan: free
    buildCommand: npx pnpm@10 install --no-frozen-lockfile && export PORT=10000 BASE_PATH=/ NODE_ENV=production && cd artifacts/carreira-360 && npx vite build --config vite.config.ts --outDir dist/public && cd ../../artifacts/api-server && node build.mjs
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: RENDER_EXTERNAL_URL
        value: https://salo-4csx.onrender.com
    healthCheckPath: /api/healthz
    autoDeploy: true
