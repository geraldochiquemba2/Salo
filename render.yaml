services:
  - type: web
    name: salo
    runtime: node
    plan: free
    buildCommand: npx pnpm@10 install && export PORT=10000 BASE_PATH=/ NODE_ENV=production && npx pnpm@10 run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
    healthCheckPath: /api/healthz
    autoDeploy: true
